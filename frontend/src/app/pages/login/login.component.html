<div class="login-page">
  <mat-card class="login-card">
    <mat-card-title>
      Gestão Escolar
    </mat-card-title>

    <mat-card-subtitle>
      Acesse sua conta
    </mat-card-subtitle>

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
    >
      <mat-form-field appearance="outline">
        <mat-label>CPF</mat-label>

        <input
          matInput
          formControlName="cpf"
          maxlength="14"
          placeholder="000.000.000-00"
          (input)="onCpfInput($event)"
        />

        <mat-error *ngIf="form.controls.cpf.hasError('required')">
          CPF é obrigatório.
        </mat-error>

        <mat-error
          *ngIf="
            form.controls.cpf.hasError('minlength') ||
            form.controls.cpf.hasError('maxlength')
          "
        >
          CPF deve conter 11 números.
        </mat-error>
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>

        <input
          matInput
          type="password"
          formControlName="password"
        />

        <mat-error *ngIf="form.controls.password.hasError('required')">
          Senha é obrigatória.
        </mat-error>
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        type="submit"
      >
        Entrar
      </button>
    </form>

    <p class="register-link">
      Não possui conta?
      <a routerLink="/register">
        Criar conta
      </a>
    </p>
  </mat-card>
</div>
