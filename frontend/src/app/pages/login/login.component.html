<div class="login-page">
  <mat-card class="login-card">
    <mat-card-title>
      Gestão Escolar
    </mat-card-title>

    <mat-card-subtitle>
      Acesse sua conta
    </mat-card-subtitle>

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
    >
      <mat-form-field appearance="outline">
        <mat-label>CPF</mat-label>

        <input
          matInput
          formControlName="cpf"
          maxlength="11"
          placeholder="Somente números"
        />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>

        <input
          matInput
          type="password"
          formControlName="password"
        />
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        type="submit"
      >
        Entrar
      </button>
    </form>

    <p class="register-link">
      Não possui conta?
      <a routerLink="/register">
        Criar conta
      </a>
    </p>
  </mat-card>
</div>
