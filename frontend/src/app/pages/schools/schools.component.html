<section class="page-header">
  <div>
    <h1>Escolas</h1>
    <p>
      Cadastre e visualize as escolas do sistema.
    </p>
  </div>
</section>

<div class="content-grid">
  <mat-card class="form-card">
    <mat-card-title>
      Nova Escola
    </mat-card-title>

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
    >
      <mat-form-field appearance="outline">
        <mat-label>Nome</mat-label>

        <input
          matInput
          formControlName="name"
          placeholder="Nome da escola"
        />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Endereço</mat-label>

        <input
          matInput
          formControlName="address"
          placeholder="Endereço completo"
        />
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        type="submit"
      >
        Salvar Escola
      </button>
    </form>
  </mat-card>

  <mat-card class="table-card">
    <mat-card-title>
      Escolas cadastradas
    </mat-card-title>

    <table
      mat-table
      [dataSource]="schools"
      class="mat-elevation-z1"
    >
      <ng-container matColumnDef="id">
        <th
          mat-header-cell
          *matHeaderCellDef
        >
          ID
        </th>

        <td
          mat-cell
          *matCellDef="let school"
        >
          {{ school.id }}
        </td>
      </ng-container>

      <ng-container matColumnDef="name">
        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Nome
        </th>

        <td
          mat-cell
          *matCellDef="let school"
        >
          {{ school.name }}
        </td>
      </ng-container>

      <ng-container matColumnDef="address">
        <th
          mat-header-cell
          *matHeaderCellDef
        >
          Endereço
        </th>

        <td
          mat-cell
          *matCellDef="let school"
        >
          {{ school.address }}
        </td>
      </ng-container>

      <tr
        mat-header-row
        *matHeaderRowDef="displayedColumns"
      ></tr>

      <tr
        mat-row
        *matRowDef="let row; columns: displayedColumns"
      ></tr>
    </table>

    <p
      class="empty-message"
      *ngIf="schools.length === 0"
    >
      Nenhuma escola cadastrada ainda.
    </p>
  </mat-card>
</div>
