<div class="register-page">
  <mat-card class="register-card">
    <mat-card-title>
      Criar Conta
    </mat-card-title>

    <mat-card-subtitle>
      Preencha os dados para acessar o sistema
    </mat-card-subtitle>

    <form
      [formGroup]="form"
      (ngSubmit)="submit()"
    >
      <mat-form-field appearance="outline">
        <mat-label>Nome</mat-label>

        <input
          matInput
          formControlName="name"
        />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>CPF</mat-label>

        <input
          matInput
          formControlName="cpf"
          maxlength="11"
          placeholder="Somente números"
        />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Senha</mat-label>

        <input
          matInput
          type="password"
          formControlName="password"
        />
      </mat-form-field>

      <mat-form-field appearance="outline">
        <mat-label>Data de nascimento</mat-label>

        <input
          matInput
          type="date"
          formControlName="birthDate"
        />
      </mat-form-field>

      <button
        mat-raised-button
        color="primary"
        type="submit"
      >
        Cadastrar
      </button>
    </form>

    <p class="login-link">
      Já possui conta?
      <a routerLink="/login">
        Entrar
      </a>
    </p>
  </mat-card>
</div>
